<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-red-500">

    <header class="flex justify-between items-center py-4 px-15">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/International_Pok%C3%A9mon_logo.svg/3840px-International_Pok%C3%A9mon_logo.svg.png"
            alt="" class="w-[200px]">

        <div class="w-100 bg-white rounded-[50px] flex p-3 items-center gap-4">
            <input id="nome" type="text" class="flex-1 h-10 outline-none pl-4" placeholder="Pesquisar pokemon...">
            <button onclick="buscarUmPokemon()" class="w-10 h-10 bg-red-500 flex justify-center items-center fill-white p-3 rounded-full">
                <box-icon name='search'></box-icon>
            </button>
        </div>

        <div class="bg-white p-3 rounded-xl">
            <select id="tipos" onchange="buscarPokemonsPortipo(event.target.value)" class="outline-none">
                <option disabled selected>Filtrar por tipo</option>
            </select>
        </div>
    </header>

    <main>

        <div id="loading" class="justify-center hidden">
            <div class="w-25 h-25 border-10 animate-spin"></div>
        </div>

        <div id="grade" class="grid gap-10 grid-cols-5 p-15">
            
        </div>
        <div class="flex justify-between px-15 pb-15">
            <button id="anterior" onclick="buscarPokemons(urlAnterior)" class="w-30 h-10 bg-yellow-500 text-blue-900 font-bold cursor-pointer rounded disabled:bg-slate-400 disabled:text-slate-600 disabled:cursor-not-allowed">Anterior</button>
            <button onclick="buscarPokemons(urlproximo)" class="w-30 h-10 bg-yellow-500 text-blue-900 font-bold cursor-pointer rounded">Próximo</button>
        </div>
    </main>

    <script src="index.js"></script>
</body>

</html>
